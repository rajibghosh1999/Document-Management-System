<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Management Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Top Navigation Bar -->
<nav class="navbar navbar-dark topbar sticky-top">
  <div class="container-fluid px-4 px-lg-5">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
      <i class="fa-solid fa-folder-open text-warning fs-5"></i>
      <span>Document Management Portal</span>
    </a>
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-light text-dark px-3 py-2 rounded-pill shadow-sm">
        <i class="fa-solid fa-shield-halved text-primary me-1"></i> Public Access
      </span>
    </div>
  </div>
</nav>

<main class="container py-4">
  <!-- VIEW 1: Main Dashboard -->
  <div id="mainDashboard">
    <!-- Create New Container Panel -->
    <section class="panel mb-4">
      <div class="section-heading">
        <i class="fa-solid fa-circle-plus"></i> Create New File Container
      </div>
      <form id="containerForm" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Container Name *</label>
          <input id="containerName" class="form-control" required placeholder="E.g., Bill Payment">
        </div>
        <div class="col-md-6">
          <label class="form-label">Title *</label>
          <input id="containerTitle" class="form-control" required placeholder="Sanction Order">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea id="containerDescription" class="form-control" rows="2" placeholder="Brief summary or description..."></textarea>
        </div>
        <div class="col-md-4">
          <label class="form-label">Date</label>
          <input id="containerDate" type="date" class="form-control">
        </div>
        <div class="col-md-4">
          <label class="form-label">Category</label>
          <select id="containerCategory" class="form-select">
            <option>General</option>
            <option>Work</option>
            <option>Government Order</option>
            <option>Finance</option>
            <option>Telemedicine</option>
            <option>IT & Logistics</option>
            <option>Reports</option>
            <option>Training</option>
            <option>Other</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Tags (comma separated)</label>
          <input id="containerTags" class="form-control" placeholder="tag1, tag2, tag3">
        </div>
        <div class="col-12 text-end">
          <button class="btn btn-primary px-4 py-2 shadow-sm">
            <i class="fa-solid fa-folder-plus me-1"></i> Create Container
          </button>
        </div>
      </form>
    </section>

    <!-- Search & Filter Panel -->
    <section class="panel mb-4">
      <div class="section-heading">
        <i class="fa-solid fa-magnifying-glass"></i> Search & Filter Containers
      </div>
      <div class="row g-3 align-items-end">
        <div class="col-lg-4">
          <label class="form-label">Search</label>
          <input id="searchInput" class="form-control" placeholder="Search name, title, tags...">
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label">Year</label>
          <select id="yearFilter" class="form-select"><option value="">All Years</option></select>
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label">Month</label>
          <select id="monthFilter" class="form-select"><option value="">All Months</option></select>
        </div>
        <div class="col-6 col-lg-2">
          <label class="form-label">Category</label>
          <select id="categoryFilter" class="form-select"><option value="">All Categories</option></select>
        </div>
        <div class="col-6 col-lg-2 d-grid">
          <button id="applyFilters" class="btn btn-dark shadow-sm">
            <i class="fa-solid fa-filter me-1"></i> Filter
          </button>
        </div>
        <div class="col-md-3">
          <label class="form-label">Start Date</label>
          <input id="startDate" type="date" class="form-control">
        </div>
        <div class="col-md-3">
          <label class="form-label">End Date</label>
          <input id="endDate" type="date" class="form-control">
        </div>
        <div class="col-md-6 d-flex gap-2 align-items-end justify-content-md-end">
          <button id="clearFilters" class="btn btn-outline-secondary btn-sm px-3">
            <i class="fa-solid fa-xmark me-1"></i> Clear
          </button>
          <button id="refreshBtn" class="btn btn-outline-primary btn-sm px-3">
            <i class="fa-solid fa-rotate me-1"></i> Refresh
          </button>
          <button id="recycleBtn" class="btn btn-outline-danger btn-sm px-3">
            <i class="fa-solid fa-trash-can me-1"></i> Recycle Bin
          </button>
        </div>
      </div>
    </section>

    <!-- Containers List Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 px-1">
      <h5 class="mb-0 fw-bold text-dark">
        <i class="fa-solid fa-folder-tree text-primary me-2"></i>File Containers 
        <span id="containerCount" class="count-pill">0</span>
      </h5>
    </div>
    
    <div id="containerList" class="row g-3"></div>
    <div id="emptyState" class="empty-state d-none">
      <i class="fa-regular fa-folder-open text-muted"></i>
      <p class="text-muted mt-2 fw-medium">No file containers found.</p>
    </div>
  </div>

  <!-- VIEW 2: Container Detail & File Management View (Initially Hidden) -->
  <div id="detailView" class="d-none">
    <button class="btn btn-outline-secondary btn-sm mb-3 shadow-sm" onclick="backToDashboard()">
      <i class="fa-solid fa-arrow-left me-1"></i> Back to Containers
    </button>
    
    <!-- Container Info Header -->
    <section class="panel mb-4 bg-white border-start border-primary border-4">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
        <div>
          <h3 id="detTitle" class="fw-bold text-dark mb-1">Container Title</h3>
          <p id="detDesc" class="text-muted mb-2"></p>
          <div class="d-flex flex-wrap gap-3 small text-secondary">
            <span id="detDate"><i class="fa-regular fa-calendar me-1"></i></span>
            <span id="detCategory"><i class="fa-solid fa-tag me-1"></i></span>
            <span id="detSize"><i class="fa-solid fa-database me-1"></i></span>
          </div>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <span id="detBadge" class="category-badge">General</span>
          <button id="zipBtn" class="btn btn-outline-dark btn-sm shadow-sm" onclick="downloadZip()">
            <i class="fa-solid fa-file-zipper me-1"></i> Download ZIP
          </button>
        </div>
      </div>
    </section>

    <!-- Upload Document Panel -->
    <section class="panel mb-4">
      <div class="section-heading">
        <i class="fa-solid fa-cloud-arrow-up"></i> Upload Document to Container
      </div>
      <div class="row g-3 align-items-end">
        <div class="col-md-6">
          <label class="form-label">Select Document *</label>
          <input id="filePicker" type="file" multiple class="form-control" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.png,.zip">
        </div>
        <div class="col-md-4">
          <label class="form-label">Document Date</label>
          <input id="docDate" type="date" class="form-control">
        </div>
        <div class="col-md-2 d-grid">
          <button id="uploadBtn" class="btn btn-primary shadow-sm" onclick="uploadFiles()">
            <i class="fa-solid fa-upload me-1"></i> Upload
          </button>
        </div>
      </div>
    </section>

    <!-- Documents List -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold mb-0 text-dark">
        <i class="fa-regular fa-file-lines text-primary me-2"></i>Documents in this Container 
        <span id="fileCountBadge" class="count-pill">0</span>
      </h5>
    </div>
    <div id="fileList" class="list-group shadow-sm"></div>
  </div>
</main>

<!-- Recycle Bin Modal -->
<div class="modal fade" id="recycleModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold text-danger"><i class="fa-solid fa-trash-can me-2"></i>Recycle Bin</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-3">
        <div id="recycleList" class="list-group"></div>
      </div>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal fade" id="previewModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content shadow-lg border-0">
      <div class="modal-header bg-dark text-white">
        <h5 id="previewTitle" class="modal-title fs-6">Document Preview</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body preview-body p-0" id="previewBody"></div>
    </div>
  </div>
</div>

<!-- Toast Notifications & Loading Overlay -->
<div id="toastHost" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<div id="loadingOverlay" class="loading-overlay d-none">
  <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
  <div class="mt-3 fw-semibold text-secondary">Processing request, please wait...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
